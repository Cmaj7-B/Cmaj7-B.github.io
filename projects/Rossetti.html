        <!-- Pre-paint hide to prevent zoom flicker -->
        <style id="prepaint-hide">html{opacity:0}</style>
        <!-- Uniform page scaling based on viewport height (no transitions) -->
        <style>
          html { --page-scale: 1; }
          #container {
            transform: scale(var(--page-scale));
            transform-origin: top center;
            width: calc(100% / var(--page-scale));
          }
        </style>
        <script>
        (function(){
          var d=document;
          function setScale(){
            var vh = window.innerHeight || d.documentElement.clientHeight;
            var targetH = 832; // baseline height where scale ≈ 1 (fits 1280×832)
            var raw = vh / targetH;
            var min = 0.94, max = 1.12; // clamp to avoid extremes
            var scale = Math.min(max, Math.max(min, raw));
            d.documentElement.style.setProperty('--page-scale', scale.toFixed(3));
            // No layout height adjustments here; scaling is visual-only
          }
          // Compute before first paint and reveal
          setScale();
          var h = d.getElementById('prepaint-hide');
          if (h && h.parentNode) h.parentNode.removeChild(h);
          d.documentElement.style.opacity = '';
          window.addEventListener('resize', setScale, {passive:true});
          // Keep simple: only react to resizes; initial run already executed before reveal
        })();
        </script>
    </head>
